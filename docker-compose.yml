services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: couverto-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-couverto}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in your .env file}
    # Not published on the host: only reachable by the server through the Docker network.
    # For local debugging, uncomment (bound to localhost only):
    # ports:
    #   - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - couverto-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: couverto-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONG_URI=mongodb://${MONGO_ROOT_USERNAME:-couverto}:${MONGO_ROOT_PASSWORD}@mongodb:27017/couverto?authSource=admin
      # No default for secrets: if missing, the API starts in configuration-error mode and the site explains what is missing
      - SECRET_ACCESS_TOKEN=${SECRET_ACCESS_TOKEN:-}
      - API_KEY_SECRET=${API_KEY_SECRET:-}
      # The API is published directly (no reverse proxy in this compose file)
      - TRUST_PROXY=${TRUST_PROXY:-0}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      - SELF_URL=${SELF_URL:-http://server:3001}
      # Email Service (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-onboarding@resend.dev}
      # Firebase Configuration
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL:-}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY:-}
      - FIREBASE_BUCKET_NAME=${FIREBASE_BUCKET_NAME:-}
      # Stripe Configuration
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Discord webhooks
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - couverto-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Frontend Client
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
        - VITE_STRIPE_PUBLIC_KEY=${VITE_STRIPE_PUBLIC_KEY:-}
    container_name: couverto-client
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    networks:
      - couverto-network

networks:
  couverto-network:
    driver: bridge

volumes:
  mongodb_data:
  server_uploads:
